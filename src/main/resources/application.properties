spring.application.name=call-auction-matching

# 证券与价格规则
call-auction.symbol=600000
call-auction.tick-size=0.01
call-auction.limit-up-ratio=0.10
call-auction.limit-down-ratio=0.10
# call-auction.reference-price=10.00

# 收盘竞价随机结束窗口(相对会话起点毫秒)与随机种子
call-auction.close-window-start-millis=60000
call-auction.close-window-length-millis=10000
call-auction.random-seed=42

# 平局消解规则 STANDARD / BUY_PRESSURE_HIGH / SELL_PRESSURE_LOW
call-auction.tie-break-by-pressure=STANDARD

# 未成交策略 CARRY / CANCEL / CONVERT_LIMIT
call-auction.unmatched-policy=CARRY

# 不平衡信息披露
call-auction.imbalance.publish-enabled=true
call-auction.imbalance.quantity-bucket-size=100
call-auction.imbalance.disclose-reference-price=true
call-auction.imbalance.publish-in-open-auction=true
call-auction.imbalance.publish-in-close-auction=true

# 持久化与恢复
call-auction.journal-dir=data/journal
call-auction.recovery-enabled=true
