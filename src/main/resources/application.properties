spring.application.name=call-auction-matching-java
server.port=8080

call-auction.symbol=SECURITY
call-auction.tick-size=0.01
call-auction.limit-change-percent=0.10
call-auction.close-window-start-millis-after-start=5000
call-auction.close-window-duration-millis=10000
call-auction.random-seed=1
call-auction.log-file=data/commands.log
call-auction.reset-on-startup=false
call-auction.default-unfilled-policy=CARRY_OVER
call-auction.imbalance.level=DIRECTION_ONLY
call-auction.imbalance.quantity-bucket-size=100
call-auction.imbalance.disclose-reference-price=false
